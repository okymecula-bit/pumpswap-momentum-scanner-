<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PumpSwap Momentum Scanner</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0b1020;color:#fff;margin:0;padding:20px}
    .card{max-width:900px;margin:auto;background:#121a2d;border-radius:16px;padding:24px}
    h1{margin-top:0}.status{padding:12px;border-radius:10px;background:#18233d;margin:15px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .box{background:#0e1628;padding:16px;border-radius:12px}
    .muted{color:#9aa8c7}
  </style>
</head>
<body>
  <div class="card">
    <h1>PumpSwap Momentum Scanner</h1>
    <div class="status" id="status">Connecting...</div>
    <div class="grid">
      <div class="box"><div class="muted">Source</div><strong>PumpSwap only</strong></div>
      <div class="box"><div class="muted">Minimum age</div><strong>5 minutes</strong></div>
      <div class="box"><div class="muted">Observation</div><strong>3–15 minutes</strong></div>
      <div class="box"><div class="muted">Confirmation</div><strong>1 minute</strong></div>
    </div>
  </div>
  <script>
    fetch('/api/status')
      .then(r=>r.json())
      .then(d=>document.getElementById('status').textContent =
        d.message || 'Scanner online')
      .catch(()=>document.getElementById('status').textContent =
        'Server connection error');
  </script>
</body>
</html>
